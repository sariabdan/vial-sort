# The only hand-picked part of the site. Everything else is generated by scripts/build_data.py.
# Take ids are <session>_t<take> (src/data/rollouts.json); v5 eval captures are v5-<run id>.

# The home page video. Times for the rack animation come from the take's grasp/release frames.
hero:
  take: 012000_20261021_152757_t2
  cam: right
  # the operator sits in the right 16% of this camera in every frame; keep the arm, racks and bin
  crop: {x: 0.10, y: 0.28, w: 0.66, h: 0.72}
  caption: "{name} (π0.5), 12k steps, 21 October 2026. Real time, one camera, cropped to the table and trimmed to the move."

# Rollouts shown beside the models (Home, Results, Experiments). Every feed the session recorded is in the
# clip: five cameras for π0.5, two for FLUX. {name} becomes the model's name from models.yaml.
# vial, at (where it ended: a slot, 'held:<slot>' or 'source') and miss are what the video shows.
featured:
  - take: 012000_20261021_152757_t2
    vial: red
    at: L3
    caption: "{name} at 12k steps, R3 → L3. Takes the vial across the table and lets go in L3, the slot asked for. The same rollout as the one at the top of the home page."
  - take: 010000_20261021_154053_t0
    vial: cyan
    at: R3
    caption: "{name} at 10k steps, L3 → R3. Over the slot it opens, grips again within half a second, then lets go. The vial ends in R3."
  - take: 012000_20261021_152757_t0
    vial: red
    at: held:L6
    caption: "{name} at 12k steps, R3 → L6. Carries the vial to the right slot and never lets go."
  - take: 012000_20261021_152757_t3
    vial: red
    at: source
    miss: L4
    caption: "{name} at 12k steps, L1 → R6. Closes on an empty hole instead of the vial."
  - take: 007000_20261016_122204_t0
    vial: red
    at: bin
    caption: "{name} at 7k steps, R1 → bin. The vial ends in the bin."
  - take: 012000_20261019_132557_t2
    vial: red
    at: bin
    caption: "{name} at 12k steps, L3 → bin. The vial ends in the bin. This checkpoint left home in only a few of its other rollouts."
  - take: 000250_20261019_172115_t0
    vial: red
    at: R1
    caption: "{name} at 250 steps, L4 → R1. The arm lets go at R1, but the vial lands on the table beside the rack. Scored as let go at the asked slot; a person marked it not in the slot."
  - take: 000500_20261019_180945_t7
    vial: red
    at: L2
    caption: "{name} at 500 steps, R3 → L6. Lifts the right vial and lets go over L2, four slots short of L6."
  - take: 030000_20261019_124848_t1
    vial: red
    at: held:L4
    caption: "{name} at 30k steps, R1 → L3. Takes the right vial across to the left rack, holds it over L4 and never lets go."
  - take: 030000_ema_20261019_130024_t0
    vial: red
    at: L1
    caption: "{name} at 30k steps, EMA weights, R1 → L3. Takes the right vial to the left rack and lets go at L1, not L3."

# Results page: one v5 eval capture per outcome (human-scored trials, matched one-to-one).
gallery:
  complete: v5-20260822-185054
  missed_pickup: v5-20260822-185547
  wrong_target: v5-20260822-185221
  missed_drop: v5-20260822-190021

# Datasets page: what one teleoperated demonstration looks like (v5 set, side camera).
demo:
  file: ee/episode_clips/ep0000_cam_side.mp4
  caption: A teleoperated demonstration from the v5 set. A person drives the leader arm; the follower copies it.

# Data page: a demonstration of the October set, all five feeds.
ws100_demo:
  episode: 10
  caption: One demonstration, seen by all five cameras at once. A person drives the leader arm; the follower copies it.

# Takes checked by eye (2026-10-22). assess_rollouts.py reads the arm's pose at release, so a
# release at the asked slot is not always a vial in that slot. vial: in_slot | not_in_slot | unclear
checked:
  012000_20261021_152757_t2: {vial: in_slot, why: "ends in the same hole as the L3 demos"}
  010000_20261021_154053_t0: {vial: in_slot, why: "ends in the same hole as the R3 demos"}
  007000_20261016_122204_t0: {vial: in_slot, why: "lying in the bin; R1 is empty"}
  012000_20261019_132557_t2: {vial: in_slot, why: "lying in the bin; L3 is empty"}
  000500_20261019_180945_t8: {vial: not_in_slot, why: "landed on the table past the left rack"}
  000250_20261019_172115_t0: {vial: not_in_slot, why: "lying on the table beside R1"}
  000500_20261019_180945_t10: {vial: not_in_slot, why: "lying across the right rack"}
  007000_20261016_123035_t2: {vial: unclear, why: "standing in the left rack, L5 or L6"}
  000500_20261019_180945_t2: {vial: unclear, why: "too dark to see"}
  030000_20261019_124848_t0: {vial: unclear, why: "hidden under the gripper"}
