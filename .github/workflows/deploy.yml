# Build the site and the project documentation and publish both to GitHub Pages on every push to main.
# Media and src/data/*.json are committed; they are regenerated on the workstation with scripts/update_site.py.
# The documentation (docs/, built by the kit in .docs-kit) is published under /vial-sort/docs/.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build the website
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check the documentation
        run: |
          python -m pip install -r .docs-kit/requirements.txt
          python .docs-kit/docsite.py build --project .
          python .docs-kit/docsite.py lint --project . --strict
          python .docs-kit/docsite.py publish --project . --out _docs
      - name: Put the documentation under docs/ of the site
        run: cp -r _docs/. dist/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
